  <line x1="620" y1="102" x2="572" y2="102" stroke="#5F5E5A" stroke-width="0.8" stroke-dasharray="4 2" marker-end="url(#arrow)"/>

  <rect x="620" y="225" width="150" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5" stroke-dasharray="4 2"/>
  <text x="695" y="244" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#2C2C2A">Automation engine</text>
  <text x="695" y="259" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#73726C">status + alarm state</text>

  <!-- Boat Link → Automation Engine -->
  <line x1="560" y1="278" x2="618" y2="256" stroke="#0F6E56" stroke-width="0.8" stroke-dasharray="4 2" marker-end="url(#arrow)"/>

  <rect x="620" y="310" width="150" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5" stroke-dasharray="4 2"/>
  <text x="695" y="329" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#2C2C2A">Passage planner</text>
  <text x="695" y="344" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#73726C">log + departure data</text>

  <!-- API → Passage Planner -->
  <line x1="560" y1="295" x2="618" y2="325" stroke="#0F6E56" stroke-width="0.8" stroke-dasharray="4 2" marker-end="url(#arrow)"/>

