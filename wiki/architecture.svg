  <rect x="30" y="360" width="540" height="80" rx="12" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5" opacity="0.35"/>
  <text x="50" y="382" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#854F0B">Data layer</text>

