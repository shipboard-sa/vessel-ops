  <text x="500" y="118" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#73726C">food + recipes</text>

  <rect x="50" y="138" width="120" height="44" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="110" y="157" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#0B2545">Ship's log</text>
  <text x="110" y="172" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#73726C">entries + reports</text>

  <rect x="180" y="138" width="120" height="44" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
