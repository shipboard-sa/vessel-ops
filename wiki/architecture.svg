  <rect x="30" y="50" width="540" height="140" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5" opacity="0.35"/>
  <text x="50" y="72" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#185FA5">Frontend (React)</text>

  <!-- Frontend boxes -->
  <rect x="50" y="84" width="120" height="44" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="110" y="103" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#0B2545">Cockpit display</text>
  <text x="110" y="118" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#73726C">read-only dashboard</text>

  <rect x="180" y="84" width="120" height="44" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
