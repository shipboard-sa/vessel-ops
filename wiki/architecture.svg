  <text x="370" y="118" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#73726C">spares + systems tree</text>

  <rect x="440" y="84" width="120" height="44" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
