  <text x="50" y="475" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#2C2C2A">Legend</text>
  <rect x="50" y="485" width="20" height="12" rx="3" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="78" y="495" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#73726C">Frontend</text>
  <rect x="150" y="485" width="20" height="12" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="178" y="495" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#73726C">API</text>
  <rect x="220" y="485" width="20" height="12" rx="3" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="248" y="495" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#73726C">Data</text>
  <rect x="300" y="485" width="20" height="12" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5" stroke-dasharray="4 2"/>
  <text x="328" y="495" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#73726C">External integration</text>
