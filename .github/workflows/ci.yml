# Purpose: CI for mx-inv - server smoke test, frontend typecheck/build, Docker image build.
# Version: v3 (2026-09-24) - v3: the api job installs requirements-dev.txt and runs the pytest
#   regression suite (tests/, hardening plan phase 1). v2 replaces the Streamlit-era v1 (three retired smoke scripts,
#   wrong branch, Python 3.12) per Docker spec v5.
# Scope: PRODUCTION - GitHub Actions for shipboard-sa/vessel-ops.
# Architecture: api = Python 3.13 + requirements-dev.txt + scripts/ci/smoke_api.py + pytest
#   (temp DBs, never the live one); frontend = `npm run build` (tsc -b + vite);
#   image = docker build + start as the stack's UID 2300 + probe /api/health.
#   Nothing is pushed to a registry until that is decided with the automation developer.
name: CI

on:
  push:
    branches: [mx-inv-webapp, master]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: API smoke (fresh DB + example boat)
        run: python scripts/ci/smoke_api.py
      - name: Regression tests
        # a stub dist so the SPA-fallback tests (404 for /api, no files outside dist) run here too
        run: |
          mkdir -p frontend/dist/assets && echo '<div id="root"></div>' > frontend/dist/index.html
          python -m pytest tests -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - run: npm ci --no-fund --no-audit
      - name: Typecheck + build
        run: npm run build

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: docker build -t vessel-ops:ci .
      - name: Start as UID 2300 on an empty data dir and probe /api/health
        run: |
          mkdir -p "$RUNNER_TEMP/data" && sudo chown 2300:2300 "$RUNNER_TEMP/data"
          docker run -d --name vessel-ops --user 2300:2300 -p 8000:8000 \
            -v "$RUNNER_TEMP/data:/srv/data" vessel-ops:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/health | grep -q '"ok"'; then
              curl -fsS http://127.0.0.1:8000/ | grep -q '<div id="root"' && exit 0
            fi
            sleep 2
          done
          docker logs vessel-ops
          exit 1
      - name: Backup job runs inside the image
        run: |
          docker exec vessel-ops python docker/backup.py --out /tmp/bk
